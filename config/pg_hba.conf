# ==============================================================================
# RetailOps — pg_hba.conf
# Règle : la première ligne qui correspond s'applique ; l'ordre compte.
# Authentification : SCRAM-SHA-256 uniquement (pas de "trust", pas de "md5").
# ==============================================================================

# TYPE       DATABASE        USER            ADDRESS              METHOD

# --- 1. Connexions locales (socket Unix, à l'intérieur du conteneur) ----------
# Administration : le superutilisateur passe par l'identité du système.
local        all             postgres                             peer
# Sauvegarde physique (pg_basebackup, bonus PITR).
local        replication     postgres                             peer
# Tous les autres comptes : mot de passe.
local        all             all                                  scram-sha-256

# --- 2. Connexions réseau : TLS obligatoire -----------------------------------
# Les sources sont les réseaux privés de Docker. L'exposition réelle à l'hôte
# est limitée par compose.yaml ("127.0.0.1:5432:5432"), pas par ce fichier.
hostssl      all             all             172.16.0.0/12        scram-sha-256
hostssl      all             all             192.168.0.0/16       scram-sha-256
hostssl      all             all             10.0.0.0/8           scram-sha-256

# --- 3. Refus explicite de tout le reste (connexion non chiffrée ou inconnue) -
hostnossl    all             all             0.0.0.0/0            reject
host         all             all             0.0.0.0/0            reject
host         all             all             ::/0                 reject