# Réseau et authentification
listen_addresses    = '*'          # exposition réelle limitée par le mapping de port Docker
port                = 5432         # port interne du conteneur
max_connections     = 100
hba_file            = '/etc/postgresql/pg_hba.conf'
password_encryption = 'scram-sha-256'

# TLS
ssl                      = on
ssl_cert_file            = '/var/lib/postgresql/tls/server.crt'
ssl_key_file             = '/var/lib/postgresql/tls/server.key'
ssl_min_protocol_version = 'TLSv1.2'

# Mémoire
shared_buffers = '128MB'           # valeur par défaut rendue explicite

# Audit et statistiques
shared_preload_libraries   = 'pgaudit,pg_stat_statements'
pgaudit.log                = 'ddl, role, write'
pgaudit.log_parameter      = off   # évite de journaliser des valeurs personnelles
pgaudit.log_relation       = on
pgaudit.log_statement_once = on
pgaudit.role               = 'auditeur'
pg_stat_statements.track   = all
track_io_timing            = on

# WAL et archivage
wal_level       = replica
archive_mode    = on
archive_command = 'test ! -f /wal_archive/%f && cp %p /wal_archive/%f'
archive_timeout = '5min'           # RPO borné à 5 minutes pour la partie WAL

# Journalisation
log_line_prefix             = '%m [%p] %q%u@%d '
log_connections             = on
log_disconnections          = on
log_lock_waits              = on
deadlock_timeout            = '1s'
log_min_duration_statement  = '500ms'
log_checkpoints             = on
log_autovacuum_min_duration = '250ms'