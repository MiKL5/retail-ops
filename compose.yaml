services:
  db:
    build: .
    container_name: retailops-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retailops}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --data-checksums"
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    secrets:
      - pg_superuser_password
    volumes:
      - pgdata:/var/lib/postgresql
      - wal_archive:/wal_archive
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./certs:/certs:ro
      - ./data:/data:ro
      - ./sql:/sql:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-retailops}"]
      interval: 10s
      timeout: 5s
      retries: 5

secrets:
  pg_superuser_password:
    file: ./secrets/pg_superuser_password.txt   # ignoré par Git

volumes:
  pgdata:
  wal_archive: